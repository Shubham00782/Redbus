name: Daily occupancy report

on:
  workflow_dispatch:
  schedule:
    # 11:45 UTC is 17:15 IST.
    - cron: "45 11 * * *"

permissions:
  contents: read

jobs:
  collect:
    name: Scrape redBus and append the sheet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        # The Redbus repository contains this project in a subfolder.
        working-directory: Redbus Occupancy
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use IPv4
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Redbus Occupancy/requirements.txt

      - name: Install Python dependencies
        working-directory: Redbus Occupancy
        run: pip install -r requirements.txt

      - name: Install Chromium
        working-directory: Redbus Occupancy
        run: playwright install --with-deps chromium

      - name: Write the Google service account key
        working-directory: Redbus Occupancy
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Add the GOOGLE_SERVICE_ACCOUNT_JSON secret before running this workflow."
            exit 1
          fi
          mkdir -p config
          python -c 'import os, pathlib; pathlib.Path("config/redbus-occupancy-586ee3125351.json").write_text(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"])'

      - name: Check that redBus answers
        run: curl -4 -I --max-time 40 -sS -o /dev/null -w "http=%{http_code} time=%{time_total}\n" https://www.redbus.in/

      - name: Collect occupancy
        working-directory: Redbus Occupancy
        run: >
          pytest testcases/test_route_occupancy.py
          -o addopts="-v --browser=chromium --screenshot=only-on-failure --tracing=retain-on-failure --alluredir=reports/allure-results"

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occupancy-run
          if-no-files-found: ignore
          path: |
            Redbus Occupancy/reports/screenshots
            Redbus Occupancy/reports/traces
            Redbus Occupancy/reports/allure-results
